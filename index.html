<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Words magic</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #D2E2E9; }
  /* The whole game renders into a VIRTUAL landscape stage (js/view.js):
     scaled to the real screen, rotated 90° on portrait phones. Canvas and
     overlays size in stage px — the transform does the rest. */
  #stage { position: fixed; left: 0; top: 0; transform-origin: 0 0; }
  canvas { display: block; touch-action: none; }
  .overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(27, 18, 16, .35); z-index: 10;
  }
  /* Start screen: the cover shows as a POP-UP card over the normal scrim
     (caps keep it a pop-up on small windows: never wider than 45vw, and its
     3:2 height never past half the viewport = 75vh wide). The milk cloud
     painted in the art is the button — a real <button> over its outline
     (fractions of the art: x .29–.925 · y .40–.60). 'deciding' = scrim only
     while the art load settles; zero art falls back to the HTML card. */
  #start { flex-direction: column; gap: 18px; }
  #start.deciding .card, #start.deciding .note, #start.deciding .cover-card { visibility: hidden; }
  #start.cover .card { display: none; }
  /* the parents' mic note is painted into the cover art — it only shows
     as text on the zero-art fallback card */
  #start.cover .note { display: none; }
  .cover-card {
    display: none; position: relative; overflow: hidden;
    border-radius: 28px; border: 0.6px solid #2B2524;
    box-shadow: 0 10px 26px rgba(27, 18, 16, .16);
    container-type: inline-size; /* the word scales with the pop-up (cqw) */
  }
  #start.cover .cover-card { display: block; width: min(625px, calc(var(--sw, 100vw) * .45), calc(var(--sh, 100vh) * .75)); }
  .cover-card img { display: block; width: 100%; } /* 3:2 art — height follows */
  #game.blur { filter: blur(3px); } /* scene stays soft until start */
  #coverBtn {
    position: absolute; left: 29%; top: 40%; width: 63.5%; height: 20%;
    padding: 0; border: 0; background: none; cursor: pointer;
    border-radius: 999px; /* the hit zone repeats the cloud capsule */
    font-family: 'Nunito', system-ui, sans-serif; font-weight: 700;
    font-size: 4.8cqw; /* = 30px at the 625 pop-up — adaptive */
    color: #6B4A33; line-height: 1; white-space: nowrap;
    box-shadow: none; /* neutralize the global button styles — only the art shows */
    -webkit-user-select: none; user-select: none;
  }
  #coverBtn:active { transform: none; background: none; }
  /* Word position is relative to the cloud BUTTON's own box, not the card.
     Press = capsule veil + the word sinks (150ms, so it is seen) — no idle
     animation. */
  #coverBtn span { position: absolute; left: calc(50.9% + 4.8%); top: calc(52% + 6%);
                   transform: translate(-50%, -50%); transition: transform .08s; }
  #coverBtn .veil { position: absolute; inset: -2% -3%; border-radius: 999px;
                    background: rgba(27, 18, 16, .14); opacity: 0;
                    transition: opacity .08s; pointer-events: none; }
  #coverBtn.pressed .veil { opacity: 1; }
  #coverBtn.pressed span { transform: translate(-50%, -60%); }
  /* Phone touch controls (js/controls.js): DOM INSIDE the stage so they
     rotate/scale with it; sizes use --u (1 real screen px in stage units,
     set by js/view.js) — the visible circle is 70 screen px inside a 96 px
     hit box (>= the 44 pt touch minimum), corner insets clear the screen
     edge and home indicator. Pressed = darken + sink (UI.md button recipe).
     Art = the buttons sheet; no art -> the procedural SVG arrows stay. */
  #stage { --u: 1px; }
  #controls { position: absolute; inset: 0; z-index: 5;
              display: none; pointer-events: none; }
  #controls.on { display: block; }
  .ctl {
    position: absolute; box-sizing: border-box;
    width: calc(96 * var(--u)); height: calc(96 * var(--u));
    padding: calc(13 * var(--u));
    border: 0; border-radius: 50%; background: none; box-shadow: none;
    cursor: pointer; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    transition: transform .08s, filter .08s;
  }
  .ctl:active { background: none; transform: none; } /* neutralize the global button styles */
  .ctl svg, .ctl img { display: block; width: 100%; height: 100%; pointer-events: none; }
  .ctl img { display: none; }
  .ctl.art img { display: block; } /* per-button: a missing sheet frame keeps its svg */
  .ctl.art svg { display: none; }
  .ctl path { stroke: #2B2524; stroke-width: 11; fill: none;
              stroke-linecap: round; stroke-linejoin: round; }
  .ctl.pressed { filter: brightness(.78); transform: translateY(calc(3 * var(--u))); }
  #ctlLeft  { left:  calc(48 * var(--u));  bottom: calc(44 * var(--u)); }
  #ctlRight { left:  calc(162 * var(--u)); bottom: calc(44 * var(--u)); }
  #ctlJump  { right: calc(48 * var(--u));  bottom: calc(44 * var(--u)); }
  .card {
    background: #F5EBDD; border: 0.6px solid #2B2524; border-radius: 28px;
    padding: 34px 46px; text-align: center;
    box-shadow: 0 10px 26px rgba(27, 18, 16, .16);
    font-family: 'Lilita One', system-ui, sans-serif;
  }
  h1 { margin: 0 0 6px; font-size: 64px; color: #2B2524; letter-spacing: 2px; }
  .sub { font-family: system-ui, sans-serif; font-size: 15px; color: rgba(43, 37, 36, .72); margin-bottom: 22px; }
  #endMsg { font-family: 'Lilita One', system-ui, sans-serif; font-size: 30px; color: #2B2524; }
  button {
    display: inline-flex; align-items: center; justify-content: center; gap: 12px;
    font-family: 'Lilita One', system-ui, sans-serif; font-size: 30px; color: #FFF8EE;
    background: #ED9794; border: 0.6px solid #2B2524; border-radius: 999px;
    padding: 12px 42px; cursor: pointer;
    box-shadow: 0 5px 14px rgba(27, 18, 16, .18);
    transition: transform .08s, background .08s;
  }
  button:active { transform: translateY(3px); background: #D9827A; }
  .tri { display: inline-block; width: 0; height: 0;
         border-left: 15px solid currentColor;
         border-top: 9px solid transparent; border-bottom: 9px solid transparent; }
  .note {
    font-family: system-ui, sans-serif; font-size: 12px; color: rgba(43, 37, 36, .55);
    margin: 18px auto 0; max-width: 280px;
  }
  #err {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 99;
    background: #F5EBDD; color: #2B2524; border: 0.6px solid #2B2524;
    font: 13px system-ui, sans-serif;
    padding: 6px 12px 6px 18px; border-radius: 8px; display: none; max-width: 80%;
    box-shadow: 0 4px 10px rgba(27, 18, 16, .14);
  }
  #err::before {
    content: ''; display: inline-block; vertical-align: middle;
    width: 7px; height: 13px; margin: -3px 7px -3px -12px;
    background: #C97870; border-radius: 4px;
  }
</style>
</head>
<body>
<div id="stage">
<canvas id="game"></canvas>

<div id="controls">
  <button class="ctl" id="ctlLeft" type="button" aria-label="назад">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="47" fill="#F5EBDD" stroke="#2B2524" stroke-width="1.6"/>
      <path d="M30 50H66M66 50 52 36M66 50 52 64" transform="rotate(180 50 50)"/>
    </svg>
    <img alt="" draggable="false">
  </button>
  <button class="ctl" id="ctlRight" type="button" aria-label="вперёд">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="47" fill="#F5EBDD" stroke="#2B2524" stroke-width="1.6"/>
      <path d="M30 50H66M66 50 52 36M66 50 52 64"/>
    </svg>
    <img alt="" draggable="false">
  </button>
  <button class="ctl" id="ctlJump" type="button" aria-label="прыжок">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="47" fill="#F5EBDD" stroke="#2B2524" stroke-width="1.6"/>
      <path d="M30 50H66M66 50 52 36M66 50 52 64" transform="rotate(-90 50 50)"/>
    </svg>
    <img alt="" draggable="false">
  </button>
</div>

<div id="start" class="overlay">
  <div class="cover-card">
    <img src="assets/art/cover.png" alt="">
    <button id="coverBtn" type="button"><span>Начать</span><i class="veil"></i></button>
  </div>
  <div class="card">
    <h1>Boo</h1>
    <div class="sub">Первые фразы в новом языке · First words</div>
    <button id="startBtn"><span class="tri"></span>Играть</button>
  </div>
  <div class="note">Родителям: игра использует микрофон — ребёнок повторяет слова голосом.
    Работает в Chrome (нужен интернет). Разрешите доступ к микрофону.</div>
</div>

<div id="again" class="overlay" style="display:none">
  <div class="card">
    <div class="sub" id="endMsg">Ура! Новый друг!</div>
    <button id="againBtn">Ещё раз!<span class="tri"></span></button>
  </div>
</div>

<div id="err"></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
